<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>معايدة الامداد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="shell">

  <!-- ── HEADER ── -->
  <header class="hd">
    <div class="logo-box">
      <img src="des/logo.png" alt="logo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
      <span class="logo-fb" style="display:none">🌙</span>
    </div>
  </header>

  <!-- ── STEP INDICATOR (built by JS) ── -->
  <div class="steps-bar" id="steps-bar"></div>

  <!-- ══ STEP 1: اختر القالب ══ -->
  <div class="step-panel active" id="sp1">
    <p class="step-heading">اختر القالب <span>— ثلاث تصاميم متاحة</span></p>
    <div class="tmpl-row" id="tmpl-row"></div>
    <button class="btn btn-primary" id="s1-next" disabled>
      <span class="bt">التالي</span>
    </button>
  </div>

  <!-- ══ STEP 2: أدخل اسمك ══ -->
  <div class="step-panel" id="sp2">
    <p class="step-heading">أدخل اسمك</p>
    <div class="sel-badge" id="sel-badge">
      <div class="sel-badge-thumb" id="badge-thumb"></div>
      <span id="badge-label">القالب المختار</span>
      <span class="badge-change" id="badge-change">تغيير</span>
    </div>
    <input class="name-inp" id="name-inp" type="text"
      placeholder="اكتب اسمك هنا" maxlength="36" dir="rtl" autocomplete="off"/>
    <button class="btn btn-primary" id="s2-next" disabled>
      <span class="bt">عرض المعايدة</span>
      <span class="spin"></span>
    </button>
  </div>

  <!-- ══ STEP 3: المعاينة والتحميل ══ -->
  <div class="step-panel" id="sp3">
    <p class="step-heading">معايدتك جاهزة 🎉</p>
    <div class="pv-wrap">
      <img id="pv-img" alt="المعايدة"/>
    </div>
    <button class="btn btn-dl" id="btn-download">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      تحميل المعايدة
    </button>
    <button class="btn btn-ghost" id="btn-restart">
      إنشاء معايدة جديدة
    </button>
  </div>

  <!-- hidden canvas for rendering -->
  <canvas id="cvs"></canvas>

  <footer class="footer">جميع الحقوق محفوظة ©</footer>
</div>
<script>
const SUPABASE_URL = 'https://xnpubpmwwalvknrtrmjd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhucHVicG13d2FsdmtucnRybWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MTAyNjcsImV4cCI6MjA4OTI4NjI2N30.-uSLztdMSUejcOWG_Hdy6XSRNRG-DK6_8x6CNXFv78M';

const _GC_SESSION = (() => {
  let id = sessionStorage.getItem('_gc_sid');
  if (!id) {
    id = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : Math.random().toString(36).slice(2) + Date.now().toString(36);
    sessionStorage.setItem('_gc_sid', id);
  }
  return id;
})();

async function trackEvent(action, template, enteredName) {
  if (!template) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/events`, {
      method: 'POST',
      headers: {
        'apikey':        SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type':  'application/json',
        'Prefer':        'return=minimal'
      },
      body: JSON.stringify({
        session_id:    _GC_SESSION,
        template_id:   template.id,
        template_name: template.label,
        entered_name:  (enteredName || '').trim() || '—',
        action
      })
    });
  } catch (_) {}
}
</script>
<script src="app.js"></script>
</body>
</html>

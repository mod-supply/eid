<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>لوحة الإدارة — مولد المعايدات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">
        <img src="../des/logo.png" alt="logo"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <span class="sb-logo-fb" style="display:none">🌙</span>
      </div>
      <span class="sb-title">مولد المعايدات</span>
      <span class="sb-subtitle">لوحة الإدارة</span>
    </div>

    <nav class="sb-nav">
      <a class="sb-link active" href="#overview" onclick="closeSidebar()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        نظرة عامة
      </a>
      <a class="sb-link" href="#charts" onclick="closeSidebar()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
        الإحصائيات
      </a>
      <a class="sb-link" href="#recent" onclick="closeSidebar()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        السجل الأخير
      </a>
      <a class="sb-link" href="../" style="margin-top:auto">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        الموقع العام
      </a>
    </nav>

    <div class="sb-footer">جميع الحقوق محفوظة ©</div>
  </aside>

  <!-- Overlay -->
  <div class="sb-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

  <!-- ══ MAIN ══ -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">لوحة الإدارة</span>
      </div>
      <div class="topbar-right">
        <span class="live-badge"><span class="live-dot"></span>مباشر</span>
        <button class="refresh-btn" id="refresh-btn" onclick="loadStats()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span class="refresh-label">تحديث</span>
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- ── STAT CARDS ── -->
      <section id="overview">
        <p class="section-title">الإجماليات</p>
        <div class="stat-cards" id="stat-cards">
          <div class="stat-card"><div class="skeleton" style="height:80px"></div></div>
          <div class="stat-card"><div class="skeleton" style="height:80px"></div></div>
          <div class="stat-card"><div class="skeleton" style="height:80px"></div></div>
          <div class="stat-card"><div class="skeleton" style="height:80px"></div></div>
        </div>
      </section>

      <!-- ── CHARTS ── -->
      <section id="charts">
        <p class="section-title">الرسوم البيانية</p>
        <div class="charts-row">

          <div class="chart-card">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">
              <span class="chart-card-title">الاستخدام عبر الزمن</span>
              <div class="period-tabs">
                <button class="period-tab active" onclick="switchPeriod('daily',this)">يومي</button>
                <button class="period-tab"        onclick="switchPeriod('weekly',this)">أسبوعي</button>
                <button class="period-tab"        onclick="switchPeriod('monthly',this)">شهري</button>
              </div>
            </div>
            <div class="chart-wrap"><canvas id="time-chart"></canvas></div>
          </div>

          <div class="chart-card">
            <p class="chart-card-title">استخدام القوالب</p>
            <div id="tmpl-bars" class="tmpl-bars">
              <div class="skeleton" style="height:40px;border-radius:8px"></div>
              <div class="skeleton" style="height:40px;border-radius:8px"></div>
              <div class="skeleton" style="height:40px;border-radius:8px"></div>
            </div>
          </div>

        </div>
      </section>

      <!-- ── RECENT TABLE ── -->
      <section id="recent">
        <div class="table-card">
          <div class="table-header">
            <span class="table-header-title">السجل الأخير</span>
            <span class="table-count" id="tbl-count">—</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>الاسم المدخل</th>
                  <th>القالب</th>
                  <th>الإجراء</th>
                  <th>التاريخ والوقت</th>
                </tr>
              </thead>
              <tbody id="events-tbody">
                <tr><td colspan="5" class="empty-state"><span class="ei">⏳</span>جارٍ التحميل…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </div><!-- /content -->
  </div><!-- /main -->

  <!-- ══ BOTTOM NAV ══ -->
  <nav class="bottom-nav">
    <a class="bn-item active" href="#overview" onclick="setBnActive(this)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      عامة
    </a>
    <a class="bn-item" href="#charts" onclick="setBnActive(this)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6"  y1="20" x2="6"  y2="14"/>
      </svg>
      إحصائيات
    </a>
    <a class="bn-item" href="#recent" onclick="setBnActive(this)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      السجل
    </a>
    <a class="bn-item" href="../">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      الموقع
    </a>
  </nav>

</div><!-- /layout -->

<script src="dashboard.js"></script>
</body>
</html>

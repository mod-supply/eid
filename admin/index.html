<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>لوحة الإدارة — مولد المعايدات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="page">

  <!-- ══ TOPBAR ══ -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="tb-logo">
        <img src="../des/logo.png" alt="logo"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <span class="tb-logo-fb" style="display:none">🌙</span>
      </div>
      <span class="tb-title">لوحة الإدارة</span>
    </div>

    <nav class="tb-nav">
      <a class="tb-link active" href="#kpi">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        نظرة عامة
      </a>
      <a class="tb-link" href="#charts">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        المخططات
      </a>
      <a class="tb-link" href="#recent">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        السجل
      </a>
    </nav>

    <div class="topbar-right">
      <span class="live-badge"><span class="live-dot"></span>مباشر</span>
      <button class="refresh-btn" id="refresh-btn" onclick="loadStats()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        تحديث
      </button>
      <a class="tb-site-link" href="../">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        الموقع
      </a>
    </div>
  </header>

  <!-- ══ CONTENT ══ -->
  <main class="content">

    <!-- KPI Cards -->
    <div class="stat-cards" id="stat-cards">
      <div class="stat-card"><div class="skeleton" style="height:44px;width:100%"></div></div>
      <div class="stat-card"><div class="skeleton" style="height:44px;width:100%"></div></div>
      <div class="stat-card"><div class="skeleton" style="height:44px;width:100%"></div></div>
      <div class="stat-card"><div class="skeleton" style="height:44px;width:100%"></div></div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">

      <!-- مخطط الزمن — يسار -->
      <div class="card" id="charts">
        <div class="card-header">
          <span class="card-title">الاستخدام عبر الزمن</span>
          <div class="period-tabs">
            <button class="period-tab active" onclick="switchPeriod('daily',this)">يومي</button>
            <button class="period-tab"        onclick="switchPeriod('weekly',this)">أسبوعي</button>
            <button class="period-tab"        onclick="switchPeriod('monthly',this)">شهري</button>
          </div>
        </div>
        <div class="card-body">
          <div class="chart-wrap"><canvas id="time-chart"></canvas></div>
        </div>
      </div>

      <!-- العمود الأيمن -->
      <div class="right-col">

        <!-- أشرطة القوالب -->
        <div class="card" style="flex-shrink:0;">
          <div class="card-header">
            <span class="card-title">استخدام القوالب</span>
          </div>
          <div class="card-body">
            <div id="tmpl-bars" class="tmpl-bars">
              <div class="skeleton" style="height:28px;border-radius:6px"></div>
              <div class="skeleton" style="height:28px;border-radius:6px;margin-top:8px"></div>
              <div class="skeleton" style="height:28px;border-radius:6px;margin-top:8px"></div>
            </div>
          </div>
        </div>

        <!-- جدول السجل -->
        <div class="card" style="flex:1;min-height:0;" id="recent">
          <div class="card-header">
            <span class="card-title">السجل الأخير</span>
            <span style="font-size:10px;color:var(--muted);font-weight:500" id="tbl-count">—</span>
          </div>
          <div class="card-body-scroll">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>الاسم</th>
                  <th>القالب</th>
                  <th>الإجراء</th>
                  <th>الوقت</th>
                </tr>
              </thead>
              <tbody id="events-tbody">
                <tr><td colspan="5">
                  <div class="empty-state">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    جارٍ التحميل…
                  </div>
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div><!-- /right-col -->
    </div><!-- /main-grid -->

  </main>

  <!-- Bottom Nav (mobile) -->
  <nav class="bottom-nav">
    <a class="bn-item active" href="#" onclick="scrollTo('kpi',this);return false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      عامة
    </a>
    <a class="bn-item" href="#" onclick="scrollTo('charts',this);return false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      مخططات
    </a>
    <a class="bn-item" href="#" onclick="scrollTo('recent',this);return false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      السجل
    </a>
    <a class="bn-item" href="../">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      الموقع
    </a>
  </nav>

</div>

<script>
function scrollTo(id, el) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  document.querySelectorAll('.bn-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
}
</script>
<script src="dashboard.js"></script>
</body>
</html>
